<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4">
    <div class="p-4 border-b border-gray-200 bg-indigo-600 rounded-t-xl">
      <h3 class="text-lg font-semibold text-white">{{ editingFunction !== null ? 'Editar' : 'Asignar' }} empleado</h3>
      <p class="text-indigo-200 text-sm mt-1">{{ employee().name }} en {{ areaName() }}</p>
    </div>

    <div class="p-4 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Función</label>
        <select
          [(ngModel)]="selectedFunction"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        >
          @for (func of getFunctions(); track func) {
            <option [value]="func">{{ getFunctionLabel(func) }}</option>
          }
        </select>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-gray-700">Horarios de trabajo</label>
          <button
            (click)="addShift()"
            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
          >
            + Agregar turno
          </button>
        </div>

        <div class="space-y-2">
          @for (shift of shifts; track $index; let i = $index) {
            <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-lg">
              <span class="text-sm text-gray-600 w-16">Turno {{ i + 1 }}</span>
              <input
                type="number"
                [(ngModel)]="shift.start"
                min="0"
                max="23"
                class="w-20 px-2 py-1 border border-gray-300 rounded text-center"
              />
              <span class="text-gray-400">a</span>
              <input
                type="number"
                [(ngModel)]="shift.end"
                min="1"
                max="24"
                class="w-20 px-2 py-1 border border-gray-300 rounded text-center"
              />
              <span class="text-gray-500 text-sm">{{ shift.end - shift.start }}h</span>
              @if (shifts.length > 1) {
                <button
                  (click)="removeShift(i)"
                  class="ml-auto text-red-500 hover:text-red-700"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              }
            </div>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button
          (click)="onCancel()"
          class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium"
        >
          Cancelar
        </button>
        <button
          (click)="onSave()"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
