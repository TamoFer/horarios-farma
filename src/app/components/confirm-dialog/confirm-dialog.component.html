@if (confirmService.pending(); as request) {
  <div class="confirm-scrim" (click)="confirmService.resolve(false)">
    <div class="confirm-surface" (click)="$event.stopPropagation()">
      <div class="flex items-center gap-3 mb-4">
        <div
          class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0"
        >
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900">Confirmar eliminación</h3>
      </div>
      <p class="text-gray-600 mb-6">
        ¿Estás seguro de que querés eliminar {{ request.item }}? Esta acción no se puede deshacer.
      </p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="confirmService.resolve(false)"
          class="px-4 py-2 rounded-lg text-sm font-medium uppercase tracking-wide text-gray-700 hover:bg-gray-100 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="confirmService.resolve(true)"
          class="px-4 py-2 rounded-lg text-sm font-medium uppercase tracking-wide text-red-600 hover:bg-red-50 transition-colors"
        >
          Eliminar
        </button>
      </div>
    </div>
  </div>
}
