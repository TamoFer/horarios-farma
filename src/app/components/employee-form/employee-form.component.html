<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
    <div class="p-4 border-b border-gray-200 bg-indigo-600 rounded-t-xl">
      <h3 class="text-lg font-semibold text-white">{{ employee() ? 'Editar' : 'Nuevo' }} Empleado</h3>
    </div>

    <div class="p-4 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Funciones</label>
        <div class="flex flex-wrap gap-2">
          @for (func of allFunctions; track func) {
            <button
              type="button"
              (click)="toggleFunction(func)"
              class="px-3 py-1 rounded-full text-sm font-medium transition-colors"
              [class.bg-indigo-600]="isFunctionSelected(func)"
              [class.text-white]="isFunctionSelected(func)"
              [class.bg-gray-100]="!isFunctionSelected(func)"
              [class.text-gray-700]="!isFunctionSelected(func)"
              [class.hover:bg-gray-200]="!isFunctionSelected(func)"
            >
              {{ functionLabels[func] }}
            </button>
          }
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Función Principal</label>
        <select
          [(ngModel)]="defaultFunction"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        >
          @for (func of functions(); track func) {
            <option [value]="func">{{ functionLabels[func] }}</option>
          }
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Horas Semanales</label>
          <input
            type="number"
            [(ngModel)]="weeklyHours"
            min="1"
            max="60"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Día Libre</label>
          <select
            [(ngModel)]="dayOff"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
            @for (day of daysOfWeek; track day) {
              <option [value]="day">{{ dayLabels[day] }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-gray-700">Horarios de trabajo</label>
          <button
            type="button"
            (click)="addShift()"
            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
          >
            + Agregar turno
          </button>
        </div>

        <div class="space-y-2">
          @for (shift of shifts(); track $index; let i = $index) {
            <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-lg">
              <span class="text-sm text-gray-600 w-16">Turno {{ i + 1 }}</span>
              <input
                type="number"
                [(ngModel)]="shift.start"
                min="0"
                max="23"
                class="w-20 px-2 py-1 border border-gray-300 rounded text-center"
              />
              <span class="text-gray-400">a</span>
              <input
                type="number"
                [(ngModel)]="shift.end"
                min="1"
                max="24"
                class="w-20 px-2 py-1 border border-gray-300 rounded text-center"
              />
              <span class="text-gray-500 text-sm">{{ shift.end - shift.start }}h</span>
              @if (shifts().length > 1) {
                <button
                  type="button"
                  (click)="removeShift(i)"
                  class="ml-auto text-red-500 hover:text-red-700"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              }
            </div>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button
          (click)="onCancel()"
          class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium"
        >
          Cancelar
        </button>
        <button
          (click)="onSave()"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
