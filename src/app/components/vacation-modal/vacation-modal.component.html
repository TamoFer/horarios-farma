<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4">
    <div class="p-4 border-b border-gray-200 bg-indigo-600 rounded-t-xl">
      <h3 class="text-lg font-semibold text-white">{{ editingVacation() ? 'Editar' : 'Nueva' }} Vacación</h3>
    </div>

    <div class="p-4 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Empleado</label>
        <select
          [ngModel]="selectedEmployeeId()"
          (ngModelChange)="selectedEmployeeId.set($event)"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        >
          @for (emp of getAvailableEmployees(); track emp.id) {
            <option [value]="emp.id">{{ emp.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Inicio</label>
        <input
          type="date"
          [ngModel]="startDate()"
          (ngModelChange)="startDate.set($event)"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Fin</label>
        <input
          type="date"
          [ngModel]="endDate()"
          (ngModelChange)="endDate.set($event)"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button
          (click)="onCancel()"
          class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium"
        >
          Cancelar
        </button>
        <button
          (click)="onSave()"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
